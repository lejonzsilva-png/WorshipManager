services:
  - type: web
    name: worshipmanager-api
    env: python
    plan: free
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: worshipmanager
      - key: JWT_SECRET
        generateValue: true